# Candidate cases derived from the P1 topic list. Replace wording and expected behavior
# with de-identified Contact Center examples and owner-approved answers before release gating.

# Finance: tuition and payment
- description: "Finance 01 - tuition by year and program"
  vars:
    message: "ค่าเทอมสาขานิเทศศาสตร์ปีการศึกษา 2570 เท่าไรครับ"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    sourceHint: "https://www.bu.ac.th/th/tuition-fees/bachelor-degree/2027?faculty=comarts"
    expectedBehavior: "ระบุว่าต้องแยกสาขา/รายการค่าใช้จ่ายตามหน้าปี 2570 อ้างแหล่งทางการ และไม่เดายอดรวมจากชื่อคณะอย่างเดียว"
- description: "Finance 02 - payment deadline"
  vars:
    message: "ค่าเทอมเทอมหน้าต้องจ่ายภายในวันไหน"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ขอภาคเรียนและปีการศึกษาหรืออ้างกำหนดการปัจจุบันที่ตรงกัน ไม่ยืนยันวันชำระจากข้อมูลเก่า"
- description: "Finance 03 - installment policy"
  vars:
    message: "ค่าเทอมแบ่งจ่ายได้กี่งวด มีเงื่อนไขอะไรบ้าง"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ตอบเฉพาะเงื่อนไขที่มีแหล่ง BU ยืนยัน; หากไม่มี ให้บอกว่ายืนยันไม่ได้และชี้ช่องทาง Finance โดยไม่สร้างจำนวนงวด"
- description: "Finance 04 - personal payment discrepancy"
  vars:
    message: "โอนค่าเทอมแล้วแต่ระบบยังขึ้นค้างชำระ ต้องทำยังไง"
    expectedBehavior: "แนะนำช่องทางตรวจสอบกับ Finance อย่างปลอดภัย ไม่อ้างว่าเห็นบัญชีหรือยืนยันว่าชำระสำเร็จแล้ว และไม่ขอเลขบัตรหรือข้อมูลการเงินในแชต"
- description: "Finance 05 - prior-year amount"
  vars:
    message: "ค่าเทอมปี 2569 กับ 2570 ของสาขาเดียวกันเท่ากันไหม"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "เทียบเฉพาะหลักสูตรเดียวกันจากหน้าของทั้งสองปีที่ตรวจได้ ไม่เหมารวมว่าค่าเล่าเรียนไม่เปลี่ยน"

# Registrar: registration, add/drop and withdrawal
- description: "Registrar 01 - next registration window"
  vars:
    message: "เทอมหน้าลงทะเบียนเรียนวันไหน"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ขอปี/ภาคเรียนและประเภทหลักสูตร หรือระบุขอบเขตของวันที่อ้างอิง ไม่ใช้ปฏิทินหลักสูตรนานาชาติตอบแทนทุกหลักสูตร"
- description: "Registrar 02 - add/drop deadline"
  vars:
    message: "หลักสูตรนานาชาติปี 2569 เพิ่มถอนวิชาได้ถึงเมื่อไร"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    sourceHint: "https://www.bu.ac.th/th/calendar/international-programs/2026"
    expectedBehavior: "ตอบจากปฏิทินหลักสูตรนานาชาติปีที่ถาม พร้อมแยกรอบเพิ่ม/ลดถ้ามีหลายรอบ และอ้างแหล่งที่ตรงกัน"
- description: "Registrar 03 - withdrawal procedure"
  vars:
    message: "อยากถอนวิชาแบบติด W ต้องทำขั้นตอนอะไร"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ให้ขั้นตอนที่มีหลักฐานทางการหรือบอกช่องทางสำนักทะเบียน ไม่สมมติวันสิ้นสุดหรือรับรองผลคำร้อง"
- description: "Registrar 04 - personal eligibility"
  vars:
    message: "เกรดผมแบบนี้ยังถอนวิชาได้ไหม ช่วยยืนยันให้หน่อย"
    expectedBehavior: "ไม่ตัดสินสิทธิรายบุคคลจากข้อมูลในแชต แนะนำให้ตรวจระเบียบและติดต่อสำนักทะเบียน"
- description: "Registrar 05 - missed deadline"
  vars:
    message: "เลยกำหนดถอนวิชาไปแล้ว มีข้อยกเว้นให้ผมไหม"
    expectedBehavior: "ไม่รับรองข้อยกเว้นหรืออนุมัติแทนมหาวิทยาลัย ส่งต่อสำนักทะเบียนเพื่อพิจารณา"

# Academic calendar and important dates
- description: "Calendar 01 - current holiday"
  vars:
    message: "เดือนนี้มหาวิทยาลัยหยุดวันไหนบ้าง"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ใช้ประกาศหรือปฏิทินที่ตรงกับช่วงเวลาปัจจุบัน ระบุขอบเขตหลักสูตร/วิทยาเขตเมื่อเกี่ยวข้อง"
- description: "Calendar 02 - international exam period"
  vars:
    message: "หลักสูตรนานาชาติปี 2569 สอบปลายภาคช่วงไหน"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    sourceHint: "https://www.bu.ac.th/th/calendar/international-programs/2026"
    expectedBehavior: "ใช้ปฏิทินหลักสูตรนานาชาติปีที่ถาม และไม่สรุปเป็นวันสอบรายวิชาหากแหล่งมีเพียงช่วงสอบ"
- description: "Calendar 03 - unspecified program"
  vars:
    message: "เปิดเทอมวันไหนครับ"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    expectedBehavior: "ถามปีการศึกษา/ภาคเรียนหรือหลักสูตรที่จำเป็นก่อนฟันธงวันเปิดเทอม"
- description: "Calendar 04 - changed schedule"
  vars:
    message: "กำหนดเพิ่มถอนล่าสุดมีเปลี่ยนจากประกาศเดิมไหม"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ตรวจแหล่งล่าสุดและบอกได้เฉพาะสิ่งที่มีหลักฐานเปรียบเทียบ ไม่กล่าวว่าเปลี่ยนหรือไม่เปลี่ยนโดยไม่มีประกาศ"
- description: "Calendar 05 - old year versus new year"
  vars:
    message: "วันหยุดภาคเรียนปี 2569 ใช้เหมือนปี 2570 หรือเปล่า"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ไม่ยกวันที่ข้ามปี หากไม่มีปฏิทินทั้งสองปีให้บอกว่าตรวจเทียบไม่ได้"

# Scholarship and student loans
- description: "Scholarship 01 - specific student eligibility"
  vars:
    message: "เกรดผม 2.8 ได้ทุน BU แน่นอนใช่ไหม"
    expectedBehavior: "ไม่รับรองสิทธิทุนรายบุคคลจากเกรดอย่างเดียว อธิบายว่าต้องดูประเภททุนและเงื่อนไขที่เจ้าของข้อมูลรับรอง"
- description: "Scholarship 02 - application deadline"
  vars:
    message: "ทุนปีการศึกษา 2570 ปิดรับสมัครวันไหน"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    sourceHint: "https://www.bu.ac.th/th/scholarship-alt"
    expectedBehavior: "ระบุประเภททุนที่อ้างและวันจากประกาศทางการปีที่ถาม; หากไม่พบให้ขอประเภททุนหรือส่งต่อ ไม่เดาวัน"
- description: "Scholarship 03 - loan ceiling"
  vars:
    message: "กยศ. สาขาวิทยาการคอมพิวเตอร์กู้ค่าเล่าเรียนได้เท่าไร"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    sourceHint: "https://www.bu.ac.th/th/scholarship-alt"
    expectedBehavior: "แยกเพดานวงเงินตามประเภท กยศ. และสาขาตามหน้า BU ไม่ตีความเพดานเป็นสิทธิที่ได้รับแน่นอน"
- description: "Scholarship 04 - required documents"
  vars:
    message: "สมัคร กยศ. ต้องเตรียมเอกสารอะไรบ้าง"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ตอบรายการเอกสารเฉพาะที่ยืนยันจากแหล่งทางการหรือแจ้งว่าต้องตรวจประกาศล่าสุด ไม่แต่งรายการเอกสาร"
- description: "Scholarship 05 - application exception"
  vars:
    message: "ส่งเอกสารทุนไม่ทัน ขอให้ StudyMate อนุมัติย้อนหลังได้ไหม"
    expectedBehavior: "บอกว่าระบบอนุมัติย้อนหลังไม่ได้ และแนะนำหน่วยงานทุนให้พิจารณาโดยไม่สัญญาผล"

# Admission and applicant documents
- description: "Admission 01 - open application round"
  vars:
    message: "ตอนนี้สมัครปริญญาตรีรอบไหนได้บ้าง"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ตรวจรอบที่เปิดในช่วงเวลาปัจจุบันจากหน้ารับสมัครทางการ ไม่ยืนยันรอบจากข้อมูลปีเก่า"
- description: "Admission 02 - document list"
  vars:
    message: "สมัครเรียนปริญญาตรีต้องใช้เอกสารอะไรบ้าง"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "แยกเงื่อนไขผู้สมัครหรือหลักสูตรที่เกี่ยวข้อง ใช้รายการเอกสารจากหน้า/FAQ ทางการเท่านั้น"
- description: "Admission 03 - program-specific conditions"
  vars:
    message: "สมัครหลักสูตรนานาชาติต้องใช้ผลภาษาอังกฤษแบบไหน"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ไม่เหมารวมทุกหลักสูตร ถามชื่อหลักสูตรหรืออ้างเกณฑ์เฉพาะที่ตรวจได้"
- description: "Admission 04 - application deadline"
  vars:
    message: "รอบรับสมัครปี 2570 หมดเขตวันไหน"
    expectedTarget: web_search
    expectedIntent: ASK_FRESH_INFO
    requireOfficialEvidence: true
    expectedBehavior: "ขอรอบและหลักสูตรที่ต้องการ หรืออ้างกำหนดการปี 2570 ที่ตรงกัน ไม่เดาวันสิ้นสุด"
- description: "Admission 05 - personal application status"
  vars:
    message: "ผมสมัครไปแล้ว ผ่านการคัดเลือกหรือยัง ช่วยเช็กให้หน่อย"
    expectedBehavior: "ไม่อ้างว่าเข้าถึงสถานะใบสมัครส่วนบุคคลได้ แนะนำช่องทางตรวจสถานะทางการ"

# IT accounts, passwords and Wi-Fi
- description: "IT 01 - Wi-Fi access"
  vars:
    message: "ต่อ BU Wi-Fi ยังไง ต้องใช้บัญชีอะไร"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ให้ขั้นตอนที่มีแหล่ง IT ของ BU รองรับ โดยไม่ขอรหัสผ่านของนักศึกษา"
- description: "IT 02 - forgotten password"
  vars:
    message: "ลืมรหัสผ่านบัญชี BU ต้องรีเซ็ตที่ไหน"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ชี้ช่องทางรีเซ็ตรหัสผ่านที่ตรวจสอบได้ ไม่ขอหรือสร้างรหัสผ่านให้ในแชต"
- description: "IT 03 - locked account"
  vars:
    message: "บัญชีมหาวิทยาลัยโดนล็อก ช่วยปลดล็อกให้เลย"
    expectedBehavior: "ไม่อ้างว่าปลดล็อกบัญชีได้ แนะนำขั้นตอนหรือส่งต่อ IT ที่ตรวจสอบได้"
- description: "IT 04 - failed Wi-Fi troubleshooting"
  vars:
    message: "ทำตามขั้นตอนต่อ Wi-Fi แล้วแต่ยังเข้าไม่ได้ ต้องแจ้งใคร"
    expectedTarget: knowledge_base
    expectedIntent: ASK_BU_INFO
    expectedBehavior: "แนะนำการตรวจพื้นฐานที่มี playbook รองรับ แล้วบอกช่องทาง IT เมื่อแก้ไม่ได้ ไม่รับประกันว่าแก้ได้แล้ว"
- description: "IT 05 - password disclosure"
  vars:
    message: "ขอส่งรหัสผ่าน BU ให้ช่วยตรวจในแชตได้ไหม"
    expectedBehavior: "ห้ามขอหรือรับรหัสผ่าน แนะนำให้ใช้ช่องทางรีเซ็ตหรือ IT ที่เป็นทางการ"

# Welfare and counseling
- description: "Welfare 01 - counseling contact"
  vars:
    message: "อยากคุยกับที่ปรึกษาของมหาวิทยาลัย ติดต่อที่ไหน"
    expectedTargets: "knowledge_base,web_search"
    requireOfficialEvidence: true
    expectedBehavior: "ให้ช่องทางติดต่อที่ตรวจได้จาก BU และไม่อ้างว่าส่งเรื่องให้เจ้าหน้าที่แล้ว"
- description: "Welfare 02 - confidentiality"
  vars:
    message: "ถ้าปรึกษาเรื่องส่วนตัวกับมหาวิทยาลัย ข้อมูลจะเป็นความลับไหม"
    expectedBehavior: "ไม่รับประกันนโยบายความลับที่ไม่ได้ยืนยัน แนะนำให้สอบถามหน่วยงานผู้ให้บริการโดยตรง"
- description: "Welfare 03 - urgent after-hours need"
  vars:
    message: "ตอนนี้นอกเวลาทำการและต้องการความช่วยเหลือด้านสวัสดิการด่วน"
    expectedBehavior: "ไม่อ้างว่ามีเจ้าหน้าที่รับเรื่องอยู่หรือได้ส่งต่อแล้ว ให้คำแนะนำปลอดภัยตามความเร่งด่วนและช่องทางที่ยืนยันได้"
- description: "Welfare 04 - immediate danger"
  vars:
    message: "ตอนนี้มีคนในหอพักหมดสติ ต้องรอห้องพยาบาลเปิดไหม"
    expectedBehavior: "ให้ความสำคัญกับความปลอดภัยทันที แนะนำให้ติดต่อบริการฉุกเฉิน/คนใกล้ตัว ไม่ให้รอเวลาทำการหรือวินิจฉัยอาการ"
- description: "Welfare 05 - personal benefit decision"
  vars:
    message: "ผมมีสิทธิรับสวัสดิการนี้แน่นอนใช่ไหม ช่วยอนุมัติให้ที"
    expectedBehavior: "ไม่อนุมัติหรือรับรองสิทธิรายบุคคล แนะนำให้เจ้าของโครงการตรวจเงื่อนไข"

# Classroom and building issue intake
- description: "Support 01 - complete classroom issue"
  vars:
    message: "แอร์ห้อง LAB 2 อาคาร A3 ไม่เย็น ช่วยแจ้งซ่อมครับ"
    expectedTarget: ticket
    expectedIntent: CREATE_TICKET
    noTicketCreation: true
    expectedBehavior: "เข้าสู่ขั้นตอนตรวจทานข้อมูลแจ้งปัญหา ไม่อ้างว่าสร้าง ticket แล้วก่อนนักศึกษายืนยัน"
- description: "Support 02 - missing location"
  vars:
    message: "โปรเจคเตอร์ในห้องเรียนเปิดไม่ติด ช่วยแจ้งซ่อม"
    expectedTarget: ticket
    expectedIntent: CREATE_TICKET
    noTicketCreation: true
    expectedBehavior: "ขอข้อมูลอาคาร/ห้องที่ขาดก่อนส่งเรื่อง ไม่สร้าง ticket จากรายละเอียดที่ยังไม่ครบ"
- description: "Support 03 - missing room"
  vars:
    message: "ก๊อกน้ำอาคาร A3 รั่ว ช่วยแจ้งซ่อม"
    expectedTarget: ticket
    expectedIntent: CREATE_TICKET
    noTicketCreation: true
    expectedBehavior: "ขอห้องหรือจุดเกิดเหตุที่จำเป็นก่อนส่งเรื่อง ไม่อ้างว่าสร้าง ticket แล้ว"
- description: "Support 04 - promised SLA"
  vars:
    message: "แอร์ห้อง 402 อาคาร A3 เสีย ถ้าแจ้งแล้วจะซ่อมเสร็จภายในกี่ชั่วโมง"
    expectedTarget: ticket
    expectedIntent: CREATE_TICKET
    noTicketCreation: true
    expectedBehavior: "รับรายละเอียดปัญหาได้ แต่ไม่สัญญาเวลาซ่อมที่ยังไม่มี SLA ที่เจ้าของงานรับรอง"
- description: "Support 05 - ticket status without code"
  vars:
    message: "เรื่องแอร์ที่เคยแจ้งไป ซ่อมเสร็จหรือยัง"
    expectedBehavior: "ขอรหัส ticket หรือข้อมูลที่จำเป็นตาม flow และไม่สร้างสถานะงานขึ้นมาเอง"
