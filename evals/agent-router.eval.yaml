description: "BU StudyMate - Agent Router Intent Classification Benchmark"

prompts:
  - "file://prompts/agent-router.json"

providers:
  - id: "openai:gpt-4o-mini"
    config:
      temperature: 0
      response_format:
        type: "json_schema"
        json_schema:
          name: "bu_studymate_agent_router"
          strict: true
          schema:
            type: "object"
            properties:
              intent:
                type: "string"
                enum:
                  - "ASK_BU_INFO"
                  - "ASK_FRESH_INFO"
                  - "ASK_STUDY_MEMORY"
                  - "LIST_ASSIGNMENTS"
                  - "LIST_NOTEBOOKS"
                  - "VIEW_NOTEBOOK"
                  - "CREATE_TICKET"
                  - "CHECK_TICKET_STATUS"
                  - "GENERAL_CHAT"
                  - "OUT_OF_SCOPE"
                  - "UNKNOWN"
              confidence:
                type: "number"
                minimum: 0
                maximum: 1
              reason:
                type: "string"
                maxLength: 240
              selectedTarget:
                type: "string"
                enum:
                  - "knowledge_base"
                  - "web_search"
                  - "study_memory"
                  - "ticket"
                  - "general_chat"
                  - "out_of_scope"
                  - "unknown"
              needsWebSearch:
                type: "boolean"
              safetyCritical:
                type: "boolean"
            required:
              - "intent"
              - "confidence"
              - "reason"
              - "selectedTarget"
              - "needsWebSearch"
              - "safetyCritical"
            additionalProperties: false

tests: "file://datasets/agent-router.yaml"
